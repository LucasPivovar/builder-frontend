.canvas-pitch-btn.is-pulsing { animation: pitch-pulse 2s infinite ease-in-out; }
@keyframes pitch-pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { transform: scale(1.025); box-shadow: 0 0 0 16px rgba(34, 197, 94, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
.pitch-main-text { font-size: 20px; font-weight: 800; text-transform: uppercase; }
.pitch-subtext { font-size: 13px; opacity: 0.92; margin-top: 4px; }
@media (max-width: 768px) { .builder-row { flex-direction: column; } .vsl-container { padding: 12px; } }

<script>
function updateBanners() {
  var now = new Date();
  var options = { weekday: "long", day: "numeric", month: "long", year: "numeric" };
  var fullDateStr = "Hoje, " + now.toLocaleDateString("pt-BR", options);
  var dateFormatted = now.toLocaleDateString("pt-BR");
  document.querySelectorAll("[data-element-type=\"top-banner\"]").forEach(function(wrapper) {
    var styleKey = wrapper.dataset.dateStyle || "full";
    var bannerText = wrapper.dataset.bannerText || "";
    var bannerNode = wrapper.querySelector(".canvas-top-banner");
    if (!bannerNode) return;
    var prefix = fullDateStr;
    if (styleKey === "warning") prefix = "⚠️ ATENÇÃO: Última chance em " + dateFormatted;
    else if (styleKey === "valid_today") prefix = "🔥 VÁLIDO SOMENTE HOJE (" + now.toLocaleDateString("pt-BR", { weekday: "long" }) + ")";
    else if (styleKey === "vagas") prefix = "⚡ AVISO IMPORTANTE: Vagas limitadas para " + now.toLocaleDateString("pt-BR", { month: "long" }) + " de " + now.getFullYear();
    else if (styleKey === "live") prefix = "🔴 AO VIVO HOJE (" + now.getDate() + " de " + now.toLocaleDateString("pt-BR", { month: "long" }) + ")";
    else if (styleKey === "none") prefix = "";
    if (prefix) bannerNode.textContent = bannerText ? prefix + ", " + bannerText : prefix;
    else bannerNode.textContent = bannerText || "Banner de Notificação";
  });
}
updateBanners();

function getAnyVideoTime() {
  if (window.smartplayer && window.smartplayer.instances && window.smartplayer.instances[0]) {
    var inst = window.smartplayer.instances[0];
    if (inst.video && !isNaN(inst.video.currentTime)) return inst.video.currentTime;
    if (!isNaN(inst.currentTime)) return inst.currentTime;
  }
  var vturbEl = document.querySelector("vturb-smartplayer");
  if (vturbEl && vturbEl.shadowRoot) {
    var shadowVid = vturbEl.shadowRoot.querySelector("video");
    if (shadowVid && !isNaN(shadowVid.currentTime)) return shadowVid.currentTime;
  }
  var v = document.querySelector("video");
  if (v && !isNaN(v.currentTime)) return v.currentTime;
  return 0;
}

document.querySelectorAll("[data-element-type=\"pitch-button\"]").forEach(function(wrapper) {
  var min = parseInt(wrapper.dataset.pitchMin) || 0;
  var sec = parseInt(wrapper.dataset.pitchSec) || 0;
  var targetSec = (min * 60) + sec;
  var pitchWrap = wrapper.querySelector(".canvas-pitch-wrapper");
  if (!pitchWrap) return;

  var storageKey = "vsl_pitch_revealed_" + min + "_" + sec;
  var isRevealedInCache = false;
  try { isRevealedInCache = localStorage.getItem(storageKey) === "true"; } catch(e) {}

  if (isRevealedInCache) {
    pitchWrap.style.display = "block";
  } else {
    pitchWrap.style.display = "none";
  }

  var revealPitch = function() {
    pitchWrap.style.display = "block";
    try { localStorage.setItem(storageKey, "true"); } catch(e) {}
  };

  var checkTime = function() {
    var t = getAnyVideoTime();
    if (t >= targetSec && targetSec > 0) {
      revealPitch();
    }
  };

  window.addEventListener("message", function(e) {
    try {
      if (!e.data) return;
      var data = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
      var curr = data.currentTime || data.time || (data.payload && data.payload.currentTime);
      if (curr !== undefined && curr >= targetSec && targetSec > 0) revealPitch();
    } catch(err) {}
  });

  setInterval(checkTime, 1000);
});
</script>
